<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Quiz từ vựng HSK - Luyện tập từ vựng tiếng Trung">
  <title>HSK Quiz - Luyện Từ Vựng</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <div class="quiz-header">
      <button class="back-btn" onclick="window.location.href='index.html'" id="back-btn">
        ← Trang chủ
      </button>
      <span class="quiz-level-badge" id="quiz-level-badge">HSK 5</span>
      <button class="btn-save-session" onclick="finishAndSaveSession()" id="save-session-btn" title="Lưu phiên chơi vào lịch sử">
        💾 Lưu & Kết thúc
      </button>
      <a class="stats-link" href="stats.html" id="stats-link">
        📊 Thống kê
      </a>
    </div>

    <!-- Quiz Area -->
    <div id="quiz-area">
      <!-- Score Bar -->
      <div class="score-bar" id="score-bar">
        <div class="score-item">
          <span class="score-label">Câu hỏi</span>
          <span class="score-value" id="question-number">1</span>
        </div>
        <div class="score-item">
          <span class="score-label">Đúng</span>
          <span class="score-value correct-text" id="correct-count">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">Sai</span>
          <span class="score-value incorrect-text" id="incorrect-count">0</span>
        </div>
      </div>

      <!-- Question -->
      <div class="question-card" id="question-card">
        <div class="question-label">Từ vựng</div>
        <div class="question-chinese" id="question-chinese">汉字</div>
        <div class="question-pinyin" id="question-pinyin">pīnyīn</div>
        <div class="question-type" id="question-type"></div>
      </div>

      <!-- Feedback + Next -->
      <div class="feedback-row" id="feedback-row">
        <div class="feedback" id="feedback"></div>
        <button class="btn-next hidden" id="next-btn" onclick="nextQuestion()">Tiếp →</button>
      </div>

      <!-- Choices -->
      <div class="choices-grid" id="choices-grid">
        <button class="choice-btn" id="choice-0" onclick="selectAnswer(0)">
          <span class="choice-letter">A</span>
          <span class="choice-text" id="choice-text-0"></span>
        </button>
        <button class="choice-btn" id="choice-1" onclick="selectAnswer(1)">
          <span class="choice-letter">B</span>
          <span class="choice-text" id="choice-text-1"></span>
        </button>
        <button class="choice-btn" id="choice-2" onclick="selectAnswer(2)">
          <span class="choice-letter">C</span>
          <span class="choice-text" id="choice-text-2"></span>
        </button>
        <button class="choice-btn" id="choice-3" onclick="selectAnswer(3)">
          <span class="choice-letter">D</span>
          <span class="choice-text" id="choice-text-3"></span>
        </button>
      </div>


    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Marked Words Section -->
    <div class="marked-section" id="marked-section">
      <div class="section-title">
        <span class="icon">📌</span>
        Từ cần ôn tập
      </div>
      <div id="marked-content">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <script src="vocab_data.js"></script>
  <script src="gemini_hsk5_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
