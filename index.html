<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Ứng dụng luyện từ vựng HSK - Học tiếng Trung qua quiz tương tác">
  <title>HSK Quiz - Luyện Từ Vựng Tiếng Trung</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="app-logo">🀄</div>
      <h1 class="app-title">HSK Quiz</h1>
      <p class="app-subtitle">Luyện từ vựng tiếng Trung mỗi ngày</p>
    </header>

    <main>
      <div class="level-grid" id="level-grid">
        <a class="level-card disabled" id="hsk3-card">
          <div class="level-badge hsk3">H3</div>
          <div class="level-info">
            <div class="level-name">HSK 3 Vocabs</div>
            <div class="level-desc">Trình độ sơ trung cấp</div>
          </div>
          <span class="coming-soon-tag">Coming Soon</span>
        </a>

        <a class="level-card disabled" id="hsk4-card">
          <div class="level-badge hsk4">H4</div>
          <div class="level-info">
            <div class="level-name">HSK 4 Vocabs</div>
            <div class="level-desc">Trình độ trung cấp</div>
          </div>
          <span class="coming-soon-tag">Coming Soon</span>
        </a>

        <a class="level-card" href="quiz.html" id="hsk5-card">
          <div class="level-badge hsk5">H5</div>
          <div class="level-info">
            <div class="level-name">HSK 5 Vocabs</div>
            <div class="level-desc">1250 từ vựng · Trình độ cao cấp</div>
          </div>
          <span class="level-arrow">→</span>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
